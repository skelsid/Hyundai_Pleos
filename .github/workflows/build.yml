name: 빌드·테스트
on:
  push:
    paths:
      - "vehicle-log/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "vehicle-log/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vehicle-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vehicle-log
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 단위 테스트, 디버그 APK, lint 를 한 번에 돌린다. 서명 키·메일 계정 없이도 된다
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: reports
          path: |
            vehicle-log/app/build/reports/
            vehicle-log/app/build/test-results/
          retention-days: 7
